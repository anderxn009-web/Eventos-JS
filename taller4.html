<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 4: Validación de Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html">&larr; Volver al inicio</a>
        <h1>Taller 4: Validación de Registro</h1>
        <p>Completa el formulario para registrarte.</p>
    </header>

    <main>
        <form id="formTaller4" novalidate>
            
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre">
            
                <label for="edad">Edad:</label>
                <input type="number" id="edad">
            
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo">
            
                <label for="password">Contraseña:</label>
                <input type="password" id="password">
            
                <label for="confirmPassword">Confirmar contraseña:</label>
                <input type="password" id="confirmPassword">
            

            <div class="botones">
                <input type="submit" value="Registrarse">
                <input type="reset" value="Limpiar">
            </div>
        </form>

        <!-- Aquí se mostrarán los mensajes de error y el resultado -->
        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="taller4.js"></script>
</body>
</html>
